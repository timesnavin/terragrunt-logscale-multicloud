apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: azure-application-gateway-classes
  namespace: region-flux-releases
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: raw
      version: "2.0.0"
      sourceRef:
        kind: HelmRepository
        name: bedag
        namespace: flux-system
      interval: 5m
  releaseName: azure-application-gateway-classes
  targetNamespace: kube-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: false
  driftDetection:
    mode: warn
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  dependsOn:
    - name: application-gateway-ingress-controller
  values:
    templates:
      - |
        apiVersion: networking.k8s.io/v1
        kind: IngressClass
        metadata:
          name: agic-shared
        spec:
          controller: azure/application-gateway
          parameters:
            apiGroup: networking.agic.microsoft.com
            kind: IngressClassParameters
            name: agic-shared
      - |
        apiVersion: networking.agic.microsoft.com/v1
        kind: IngressClassParameters
        metadata:
          name: agic-shared
        spec:
          applicationGatewayName: ${application_gateway_name}
          resourceGroup: ${resource_group_name}
          subscriptionID: ${subscription_id}
          shared: true
      - |
        apiVersion: networking.k8s.io/v1
        kind: IngressClass
        metadata:
          name: agic-dedicated
        spec:
          controller: azure/application-gateway
          parameters:
            apiGroup: networking.agic.microsoft.com
            kind: IngressClassParameters
            name: agic-dedicated
      - |
        apiVersion: networking.agic.microsoft.com/v1
        kind: IngressClassParameters
        metadata:
          name: agic-dedicated
        spec:
          applicationGatewayName: ${application_gateway_name}
          resourceGroup: ${resource_group_name}
          subscriptionID: ${subscription_id}
          shared: false
