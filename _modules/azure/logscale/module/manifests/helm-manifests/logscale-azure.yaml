apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: logscale
  namespace: ${namespace}
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: logscale
      version: "7.0.0-next.130"
      sourceRef:
        kind: HelmRepository
        name: logscale-contrib-ls
        namespace: flux-system
      interval: 5m
  releaseName: logscale
  install:
    disableWaitForJobs: true
    remediation:
      retries: 3
  upgrade:
    disableWaitForJobs: true
  test:
    enable: false
  driftDetection:
    mode: warn
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    platform:
      provider: azure
    fullnameOverride: logscale

    humio:
      image:
        tag: 1.132.0
      trustManagerConfigMap: cluster-trust-bundle
      extraENV:
        - name: HUMIO_OPTS
          value: -XX:+UseNUMA -XX:+UseTransparentHugePages
        - name: AZURE_CLIENT_ID
          value: "${managed_identity_client_id}"
        - name: HUMIO_MAX_DIRECT_MEMORY_SIZE_MB
          value: "1024"
        - name: MAX_SERIES_LIMIT
          value: "1000"
        - name: ENABLE_IOC_SERVICE
          value: "false"
        - name: KAFKA_JAAS
          valueFrom:
            secretKeyRef:
              name: ${tenant}-logscale
              key: sasl.jaas.config
      kafka:
        manager: external
        prefixEnable: true
        bootstrap: ${kafka_name}-kafka-bootstrap.${kafka_namespace}.svc:9093
        topicPrefix: ${tenant}-logscale-${kafka_prefix}
        extraConfig: |
          config.providers=env
          config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
          ssl.truststore.location=/data/truststore/bundle.jks
          security.protocol=SASL_SSL
          sasl.mechanism=SCRAM-SHA-512
          sasl.jaas.config=$${env:KAFKA_JAAS}
      buckets:
        type: azure
        storageAccount: ${storage_account_name}
        container: ${container_storage}
        prefix: ${container_prefix}
        exportContainer: ${container_export}
        archiveContainer: ${container_archive}
      fqdnInputs: ${fqdn_ingest}
      fqdn: ${fqdn}
      license: ${logscale_license}
      config:
        enableInternalLogger: "true"
      serviceAccount:
        name: ${logscale_sa_name}
        annotations:
          azure.workload.identity/client-id: ${managed_identity_client_id}
          azure.workload.identity/tenant-id: ${tenant_id}
      auth:
        rootUser: ${rootUser}
        method: saml
        saml:
          groupMembershipAttribute: http://schemas.xmlsoap.org/claims/Group
          signOnUrl: ${saml_url}
          entityID: ${saml_issuer}
          idpCertificate: ${saml_signing_certificate}

      nodeCount: 2
      resources:
        requests:
          memory: 16Gi
          cpu: 2
        limits:
          memory: 32Gi
          cpu: 12
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "kubernetes.io/arch"
                    operator: "In"
                    values: ["amd64"]
                  - key: "kubernetes.io/os"
                    operator: "In"
                    values: ["linux"]
                  - key: "kubernetes.azure.com/storageprofile"
                    operator: "In"
                    values: ["managed"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: humio.com/node-pool
                    operator: In
                    values:
                      - "logscale"
                      - "logscale-ingest-only"
                      - "logscale-http-only"
              topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 2
          minDomains: 2
          whenUnsatisfiable: DoNotSchedule
          topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchExpressions:
              - key: humio.com/node-pool
                operator: In
                values:
                  - logscale

      dataVolumePersistentVolumeClaimSpecTemplate:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "468Gi"
        storageClassName: "managed-premium"

      frontEndDataVolumePersistentVolumeClaimSpecTemplate:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "10Gi"
        storageClassName: "managed-premium"
      priorityClass: partition-high

      ingress:
        ui:
          className: azure-application-gateway
          enabled: true
          tls: true
          annotations:
            appgw.ingress.kubernetes.io/ssl-redirect: "true"
            appgw.ingress.kubernetes.io/backend-protocol: "https"
        inputs:
          className: azure-application-gateway
          enabled: true
          tls: true
          annotations:
            appgw.ingress.kubernetes.io/ssl-redirect: "true"
            appgw.ingress.kubernetes.io/backend-protocol: "https"

      nodepools:
        ingest:
          priorityClass: partition-medium
          nodeCount: 2
          resources:
            requests:
              cpu: "1"
              memory: 16Gi
            limits:
              cpu: "2"
              memory: 21Gi
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: "kubernetes.io/arch"
                        operator: "In"
                        values: ["amd64"]
                      - key: "kubernetes.io/os"
                        operator: "In"
                        values: ["linux"]
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: humio.com/node-pool
                        operator: In
                        values:
                          - "logscale"
                          - "logscale-ingest-only"
                          - "logscale-http-only"
                  topologyKey: "kubernetes.io/hostname"
          topologySpreadConstraints:
            - maxSkew: 2
              minDomains: 2
              whenUnsatisfiable: DoNotSchedule
              topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchExpressions:
                  - key: humio.com/node-pool
                    operator: In
                    values:
                      - logscale-ingest-only
        ui:
          priorityClass: partition-low
          nodeCount: 2
          resources:
            requests:
              cpu: "1"
              memory: 16Gi
            limits:
              cpu: "2"
              memory: 32Gi
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: "kubernetes.io/arch"
                        operator: "In"
                        values: ["amd64"]
                      - key: "kubernetes.io/os"
                        operator: "In"
                        values: ["linux"]
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: humio.com/node-pool
                        operator: In
                        values:
                          - "logscale"
                          - "logscale-ingest-only"
                          - "logscale-http-only"
                  topologyKey: "kubernetes.io/hostname"
          topologySpreadConstraints:
            - maxSkew: 2
              minDomains: 2
              whenUnsatisfiable: DoNotSchedule
              topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchExpressions:
                  - key: humio.com/node-pool
                    operator: In
                    values:
                      - "logscale-http-only"
