apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: ${tenant}-logscale
  namespace: ${kafka_namespace}
  annotations:
    azure.workload.identity/use: "true"
    azure.workload.identity/service-account: "${kafka_service_account}"
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: logscale-strimzi-kafka-topics
      version: "3.0.1"
      sourceRef:
        kind: HelmRepository
        name: logscale-contrib
        namespace: flux-system
      interval: 5m
  releaseName: ${tenant}-logscale
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: false
  driftDetection:
    mode: enabled
  dependsOn:
    - name: kafka
  values:
    config:
      clusterName: ${kafka_name}
      prefix: ${prefix}
      user:
        authentication:
          type: scram-sha-512
        authorization:
          enabled: true
          type: simple
        secretTemplate:
          metadata:
            annotations:
              # Original reflection annotations
              reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
              reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
              reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "${logscale_namespace}"
              reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "${logscale_namespace}"
              # Azure KeyVault integration (if using)
              azure.keyvault.enabled: "true"
              azure.keyvault.secret-name: "${tenant}-kafka-credentials"
              azure.keyvault.vault-name: "${keyvault_name}"
        # Optional: Azure-specific network policies
        networkPolicies:
          enabled: true
          allowedNamespaces:
            - "${logscale_namespace}"
        # Optional: Azure Monitor integration
        monitoring:
          enabled: true
          azureMonitor:
            enabled: true
            metricLabels:
              tenant: "${tenant}"
              component: "kafka"
